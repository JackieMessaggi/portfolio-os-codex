<div style="width: 393px; height: 852px; position: relative; overflow: hidden; background: var(--background-primary); font-family: var(--font-text); color: var(--text-primary);">
  <sc-if value="{{overFinding}}" hint-placeholder-val="{{ true }}">
    <dc-import name="SCR05" variant="Default" hint-size="393px,852px"></dc-import>
  </sc-if>
  <sc-if value="{{overGap}}" hint-placeholder-val="{{ false }}">
    <dc-import name="SCR07" variant="Default" hint-size="393px,852px"></dc-import>
  </sc-if>
  <div aria-hidden="true" style="position: absolute; inset: 0; background: var(--surface-inverse); opacity: 0.4;"></div>
  <div style="position: absolute; left: 0; right: 0; bottom: 0; display: flex; justify-content: center;">
    <section role="dialog" aria-label="Correct the plant" style="width: 100%; max-width: 390px; box-sizing: border-box; display: flex; flex-direction: column; padding-bottom: calc(var(--space-32) + var(--space-2)); background: var(--surface-default); border-radius: var(--radius-xl) var(--radius-xl) 0 0; box-shadow: var(--elevation-3-sheet);">
      <div style="display: flex; justify-content: center; padding: var(--space-8) 0 var(--space-4);">
        <span style="width: 60px; height: 4px; border-radius: var(--radius-full); background: var(--border-default);"></span>
      </div>
      <div style="display: flex; align-items: center; gap: var(--space-8); padding: var(--space-4) var(--padding-sm) var(--space-4) var(--padding-lg);">
        <h2 class="display-title-3" style="margin: 0; flex: 1;">Correct the plant</h2>
        <x-import component-from-global-scope="Snoof.IconButton" icon="Close" label="Close" on-click="{{on.close}}"></x-import>
      </div>
      <div style="display: flex; flex-direction: column; gap: var(--layout-gap-group); padding: var(--space-8) var(--padding-lg) 0; align-items: center;">
        <p class="text-body" style="margin: 0; align-self: stretch;">{{explainer}}</p>
        <button type="button" onClick="{{on.search}}" style="align-self: stretch; display: flex; align-items: center; gap: var(--space-12); min-height: 56px; padding: var(--padding-sm) var(--padding-md); border: 0; border-radius: var(--radius-lg); background: var(--action-secondary-background); color: var(--action-secondary-text); font: inherit; text-align: left; cursor: pointer; box-sizing: border-box;">
          <x-import component-from-global-scope="Snoof.Icon" name="Search" size="{{n24}}" color="var(--action-secondary-text)"></x-import>
          <span class="text-headline" style="flex: 1;">Search by name</span>
          <x-import component-from-global-scope="Snoof.Icon" name="Chevron Right" size="{{n20}}" color="var(--action-secondary-text)"></x-import>
        </button>
        <button type="button" onClick="{{on.photo}}" style="align-self: stretch; display: flex; align-items: center; gap: var(--space-12); min-height: 56px; padding: var(--padding-sm) var(--padding-md); border: 0; border-radius: var(--radius-lg); background: var(--action-secondary-background); color: var(--action-secondary-text); font: inherit; text-align: left; cursor: pointer; box-sizing: border-box;">
          <x-import component-from-global-scope="Snoof.Icon" name="Camera" size="{{n24}}" color="var(--action-secondary-text)"></x-import>
          <span class="text-headline" style="flex: 1;">Identify from photo</span>
          <x-import component-from-global-scope="Snoof.Icon" name="Chevron Right" size="{{n20}}" color="var(--action-secondary-text)"></x-import>
        </button>
        <div style="align-self: stretch; display: flex;">
          <x-import component-from-global-scope="Snoof.Button" hierarchy="Text" label="Cancel" fill="{{yes}}" style="flex: 1;" on-click="{{on.cancel}}"></x-import>
        </div>
      </div>

<script type="text/x-dc" data-dc-script data-props='{"host":{"editor":"enum","options":["SCR05","SCR07"],"default":"SCR05"},"$preview":{"width":393,"height":852}}'>
class Component extends DCLogic {
  renderVals() {

    const A = this.props.act || null;
    const PN = (A && this.props.petName) || 'J\u00e4ger';
    const fire = (k) => (e) => { if (!A || !A[k]) return; if (e && e.preventDefault) e.preventDefault(); A[k](); };
    const lk = (href) => (A ? '#' : href);
    const on = {close: fire('close'), cancel: fire('cancel'), search: fire('search'), photo: fire('photo')};
    const h = this.props.host ?? 'SCR05';
    return {
      petName: PN,
      yes: true,
      on: on,
      n20: 20, n24: 24,
      overFinding: h === 'SCR05',
      overGap: h === 'SCR07',
      explainer: h === 'SCR07'
        ? 'Choosing another plant replaces this result. The pet stays the same: ' + PN + ' · Cat.'
        : 'Choosing another plant replaces this result. The pet stays the same: ' + PN + ' · Cat.'
    };
  }
}
</script>
