<div style="width: 393px; height: 852px; position: relative; overflow: hidden; background: var(--background-primary); font-family: var(--font-text); color: var(--text-primary);">
  <sc-if value="{{overHome}}" hint-placeholder-val="{{ true }}">
    <dc-import name="SCR02" variant="{{homeVariant}}" hint-size="393px,852px"></dc-import>
  </sc-if>
  <sc-if value="{{overConfirm}}" hint-placeholder-val="{{ false }}">
    <dc-import name="MOD02" plant="{{hostPlant}}" variant="{{confirmVariant}}" hint-size="393px,852px"></dc-import>
  </sc-if>
  <div aria-hidden="true" style="position: absolute; inset: 0; background: var(--surface-inverse); opacity: 0.4;"></div>
  <div aria-hidden="true" style="position: absolute; left: 0; right: 0; bottom: 0; height: var(--radius-xl); background: var(--surface-default);"></div>
  <div data-sheet-host="true" style="position: absolute; left: 0; right: 0; top: calc(var(--space-48) + var(--space-12)); bottom: 0; display: flex; flex-direction: column; justify-content: flex-end; align-items: stretch;">
    <x-import component-from-global-scope="Snoof.BottomSheet" style="display: flex; justify-content: center; width: 100%;" title="Pet for this check" primary-label="Continue" show-secondary-action="{{no}}" state="{{sheetState}}" on-primary="{{on.mod01Continue}}" on-close="{{on.mod01Close}}">
      <div data-scroll-region="true" style="max-height: 576px; overflow-y: auto; overflow-x: hidden; scrollbar-width: none;">
        <div style="display: flex; flex-direction: column; gap: var(--layout-gap-group);">
          <div style="display: flex; flex-direction: column; gap: var(--layout-gap-stack);">
            <span class="text-subheadline-emphasized" style="color: var(--text-primary);">Species (required)</span>
            <x-import component-from-global-scope="Snoof.SpeciesSelector" selection="{{species}}" on-select="{{pickSpecies}}"></x-import>
            <sc-if value="{{showSpeciesHelper}}" hint-placeholder-val="{{ false }}">
              <span class="text-footnote" style="color: var(--text-primary);">Choose cat or dog to continue.</span>
            </sc-if>
          </div>

          <sc-if value="{{showBehaviours}}" hint-placeholder-val="{{ true }}">
            <div style="display: flex; flex-direction: column; gap: var(--layout-gap-stack);">
              <span class="text-subheadline-emphasized" style="color: var(--text-primary);">How does this pet interact with plants? (optional)</span>
              <x-import component-from-global-scope="Snoof.BehaviourOption" control="Checkbox" label="Bites, chews or eats plants" state="{{b1}}"></x-import>
              <x-import component-from-global-scope="Snoof.BehaviourOption" control="Checkbox" label="Sniffs or smells plants" state="Unselected"></x-import>
              <x-import component-from-global-scope="Snoof.BehaviourOption" control="Checkbox" label="Touches or rubs against plants" state="{{b3}}"></x-import>
              <x-import component-from-global-scope="Snoof.BehaviourOption" control="Checkbox" label="Lies or sleeps on plants or pots" state="Unselected"></x-import>
              <x-import component-from-global-scope="Snoof.BehaviourOption" control="Checkbox" label="Drinks water from pots, saucers or vases" state="Unselected"></x-import>
              <x-import component-from-global-scope="Snoof.BehaviourOption" control="Checkbox" label="Other" state="{{b6}}"></x-import>
              <sc-if value="{{showOther}}" hint-placeholder-val="{{ true }}">
                <x-import component-from-global-scope="Snoof.TextField" label="Other behaviour" placeholder="Describe what your pet does" show-helper="{{no}}" state="Focused"></x-import>
              </sc-if>
              <span class="text-footnote" style="color: var(--text-secondary);">Or</span>
              <x-import component-from-global-scope="Snoof.BehaviourOption" control="Radio" label="I don't know" state="Unselected"></x-import>
              <x-import component-from-global-scope="Snoof.BehaviourOption" control="Radio" label="My pet doesn't usually interact with plants" state="Unselected"></x-import>
            </div>
          </sc-if>

          <p class="text-subheadline" style="margin: 0; color: var(--text-secondary);">Behaviour is context, not a prediction. Documented exposure routes exist regardless.</p>

          <sc-if value="{{isLoading}}" hint-placeholder-val="{{ false }}">
            <p class="text-subheadline-emphasized" role="status" style="margin: 0; color: var(--text-primary);">Checking sources for {{plantName}}…</p>
          </sc-if>
        </div>
      </div>
    </x-import>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"variant":{"editor":"enum","options":["A","ADisabled","B","Loading"],"default":"A"},"$preview":{"width":393,"height":852}}'>
class Component extends DCLogic {
  renderVals() {

    const A = this.props.act || null;
    const fire = (k) => (e) => { if (!A || !A[k]) return; if (e && e.preventDefault) e.preventDefault(); A[k](); };
    const lk = (href) => (A ? '#' : href);
    const on = {mod01Continue: fire('mod01Continue'), mod01Close: fire('mod01Close')};
    const pickSpecies = (s) => { if (A && s === 'Cat' && A.selectCat) A.selectCat(); };
    const v = this.props.variant ?? 'A';
    const isA = v === 'A';
    const isAD = v === 'ADisabled';
    const overConfirmHost = A ? this.props.host === 'confirm' : !(isA || isAD);
    return {
      no: false, on: on, pickSpecies: pickSpecies,
      overHome: !overConfirmHost,
      overConfirm: overConfirmHost,
      homeVariant: (A && this.props.homeVariant) || 'PS1', confirmVariant: (A && this.props.confirmVariant) || 'A',
      sheetState: isAD ? 'CTA disabled' : (v === 'Loading' ? 'CTA loading' : 'Default'),
      species: isAD ? 'None' : 'Cat',
      showSpeciesHelper: isAD,
      showBehaviours: isA || isAD,
      b1: isA ? 'Selected' : 'Unselected',
      b3: isA ? 'Selected' : 'Unselected',
      b6: isA ? 'Selected' : 'Unselected',
      showOther: isA,
      isLoading: v === 'Loading',
      plantName: A && this.props.plant === 'fern' ? 'Boston fern' : (A && this.props.plant === 'shield' ? 'Red shield plant' : 'Easter lily'),
      hostPlant: A ? (this.props.plant || 'lily') : 'lily'
    };
  }
}
</script>
</body>
</html>
