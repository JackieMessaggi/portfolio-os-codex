">\n        <div style=\"display: flex; flex-direction: column; gap: var(--layout-gap-group);\">\n          <div style=\"display: flex; flex-direction: column; gap: var(--layout-gap-stack);\">\n            <span class=\"text-subheadline-emphasized\" style=\"color: var(--text-primary);\">Species (required)<\/span>\n            <x-import component-from-global-scope=\"Snoof.SpeciesSelector\" selection=\"{{species}}\" on-select=\"{{pickSpecies}}\"><\/x-import>\n            <sc-if value=\"{{showSpeciesHelper}}\" hint-placeholder-val=\"{{ false }}\">\n              <span class=\"text-footnote\" style=\"color: var(--text-primary);\">Choose cat or dog to continue.<\/span>\n            <\/sc-if>\n          <\/div>\n\n          <sc-if value=\"{{showBehaviours}}\" hint-placeholder-val=\"{{ true }}\">\n            <div style=\"display: flex; flex-direction: column; gap: var(--layout-gap-stack);\">\n              <span class=\"text-subheadline-emphasized\" style=\"color: var(--text-primary);\">How does this pet interact with plants? (optional)<\/span>\n              <x-import component-from-global-scope=\"Snoof.BehaviourOption\" control=\"Checkbox\" label=\"Bites, chews or eats plants\" state=\"{{b1}}\"><\/x-import>\n              <x-import component-from-global-scope=\"Snoof.BehaviourOption\" control=\"Checkbox\" label=\"Sniffs or smells plants\" state=\"Unselected\"><\/x-import>\n              <x-import component-from-global-scope=\"Snoof.BehaviourOption\" control=\"Checkbox\" label=\"Touches or rubs against plants\" state=\"{{b3}}\"><\/x-import>\n              <x-import component-from-global-scope=\"Snoof.BehaviourOption\" control=\"Checkbox\" label=\"Lies or sleeps on plants or pots\" state=\"Unselected\"><\/x-import>\n              <x-import component-from-global-scope=\"Snoof.BehaviourOption\" control=\"Checkbox\" label=\"Drinks water from pots, saucers or vases\" state=\"Unselected\"><\/x-import>\n              <x-import component-from-global-scope=\"Snoof.BehaviourOption DEsMTA4LDg0Wm0xMjgsNDRBMTA4LDEwOCwwLDEsMSwxMjgsMjAsMTA4LjEyLDEwOC4xMiwwLDAsMSwyMzYsMTI4Wm0tMjQsMGE4NCw4NCwwLDEsMC04NCw4NEE4NC4wOSw4NC4wOSwwLDAsMCwyMTIsMTI4Wm0tNzIsMzYuNjhWMTMyYTIwLDIwLDAsMCwwLTIwLTIwLDEyLDEyLDAsMCwwLTQsMjMuMzJWMTY4YTIwLDIwLDAsMCwwLDIwLDIwLDEyLDEyLDAsMCwwLDQtMjMuMzJaIj48L3BhdGg+PC9zdmc+); }\n<\/style>\n<\/helmet>\n<div style=\"width: 393px; height: {{rootHeight}}; min-height: 852px; position: relative; overflow: hidden; background: var(--background-primary); font-family: var(--font-text); color: var(--text-primary);\">\n  <div style=\"position: absolute; left: 0; top: 0; width: 393px; height: 852px; overflow: hidden;\">\n    <sc-if value=\"{{lily}}\" hint-placeholder-val=\"{{ true }}\"><dc-import name=\"SCR05\" variant=\"Default\" hint-size=\"393px,852px\"><\/dc-import><\/sc-if>\n    <sc-if value=\"{{shield}}\" hint-placeholder-val=\"{{ false }}\"><dc-import name=\"SCR07\" variant=\"Default\" hint-size=\"393px,852px\"><\/dc-import><\/sc-if>\n  <\/div>\n  <div aria-hidden=\"true\" style=\"position: absolute; inset: 0; background: var(--surface-inverse); opacity: 0.4;\"><\/div>\n  <section role=\"dialog\" aria-label=\"Sources and evidence\" style=\"position: {{sheetPosition}}; left: 0; right: 0; top: {{sheetTop}}; bottom: 0; margin-top: {{sheetMarginTop}}; display: flex; flex-direction: column; background: var(--surface-default); border-radius: var(--radius-xl) var(--radius-xl) 0 0; box-shadow: var(--elevation-3-sheet);\">\n    <div style=\"flex: none; display: flex; justify-content: center; padding: var(--space-8) 0 var(--space-4);\">\n      <span style=\"width: 60px; height: 4px; border-radius: var(--radius-full); background: var(--border-default);\"><\/span>\n    <\/div>\n    <div style=\"flex: none; display: flex; align-items: center; gap: var(--space-8); padding: var(--space-4) var(--padding-sm) var(--space-4) var(--padding-lg); border-bottom: var(--border-width-default) solid var(--border-subtle);\">\n      <h2 class=\"display-title-3\" style=\"margin: 0; flex: 1;\">Sources &amp; evidence<\/h2>\n      <x-import component-from-global-scope=\"Snoof.IconButton\" icon=\"Close\" label=\"Close\" on-click=\"{{onClose}}\"><\/x-import>\n    <\/div>\n\n    <div data-scroll-region=\"true\" style=\"flex: {{scrollFlex}}; min-height: 0; overflow-y: {{scrollOverflow}}; overflow-x: hidden; scrollbar-width: none;\">\n      <div style=\"display: flex; flex-direction: column; gap: var(--layout-gap-section); padding: var(--space-16) var(--padding-lg) calc(var(--space-32) + var(--space-32) + var(--space-2));\">\n        <sc-if value=\"{{lily}}\" hint-placeholder-val=\"{{ true }}\">\n        <div style=\"display: flex; flex-direction: column; gap: var(--space-4);\">\n          <span><span class=\"text-headline\">Easter lily<\/span> <span class=\"text-body\" style=\"color: var(--text-secondary);\">·<\/span> <span class=\"text-body\" style=\"font-style: italic;\">Lilium longiflorum<\/span><\/span>\n          <span class=\"text-subheadline\" style=\"color: var(--text-secondary);\">Checked for cats<\/span>\n        <\/div>\n\n        <div style=\"display: flex; flex-direction: column; gap: var(--space-12);\">\n          <span class=\"text-subheadline-emphasized\" style=\"color: var(--text-secondary);\">Each source<\/span>\n\n          <article style=\"display: flex; flex-direction: column; gap: var(--space-8); padding: var(--padding-md); border-radius: var(--radius-sm); border: var(--border-width-default) solid var(--border-default);\">\n            <span class=\"text-headline\">ASPCA<\/span>\n            <p class=\"text-callout\" style=\"margin: 0;\"><span class=\"text-subheadline-emphasized\">Supports: <\/span>classification (toxic to cats); effects including kidney failure, and that death is possible; kidney failure within 48–72 hours; very small exposures, including pollen; cats as the only species known to be affected.<\/p>\n            <p class=\"text-callout\" style=\"margin: 0;\"><span class=\"text-subheadline-emphasized\">Refers to: <\/span>Easter lily · cats<\/p>\n            <p class=\"text-callout\" style=\"margin: 0;\"><span class=\"text-subheadline-emphasized\">Independence: <\/span>not verified.<\/p>\n          <\/article>\n\n          <article style=\"display: flex; flex-direction: column; gap: var(--space-8); padding: var(--padding-md); border-radius: var(--radius-sm); border: var(--border-width-default) solid var(--border-default);\">\n            <span class=\"text-headline\">Pet Poison Helpline<\/span>\n            <p class=\"text-callout\" style=\"margin: 0;\"><span class=\"text-subheadline-emphasized\">Supports: <\/span>classification; all plant parts; eating any part of a lily from the Lilium genus; water from a vase holding lilies.<\/p>\n            <p class=\"text-callout\" style=\"margin: 0;\"><span class=\"text-subheadline-emphasized\">Refers to: <\/span>lilies (Lilium genus) · cats<\/p>\n            <p class=\"text-callout\" style=\"margin: 0;\"><span class=\"text-subheadline-emphasized\">Independence: <\/span>counts as one source together with MSD Veterinary Manual.<\/p>\n          <\/article>\n\n          <article style=\"display: flex; flex-direction: column; gap: var(--space-8); padding: var(--padding-md); border-radius: var(--radius-sm); border: var(--border-width-default) solid var(--border-default);\">\n            <span class=\"text-headline\">Cats Protection<\/span>\n            <p class=\"text-callout\" style=\"margin: 0;\"><span class=\"text-subheadline-emphasized\">Supports: <\/span>classification; pollen picked up by rubbing against the flower and licking the fur; advice not to have lilies in the home or garden.<\/p>\n            <p class=\"text-callout\" style=\"margin: 0;\"><span class=\"text-subheadline-emphasized\">Refers to: <\/span>lilies · cats<\/p>\n            <p class=\"text-callout\" style=\"margin: 0;\"><span class=\"text-subheadline-emphasized\">Independence: <\/span>not verified.<\/p>\n          <\/article>\n\n          <article style=\"display: flex; flex-direction: column; gap: var(--space-8); padding: var(--padding-md); border-radius: var(--radius-sm); border: var(--border-width-default) solid var(--border-default);\">\n            <span class=\"text-headline\">MSD Veterinary Manual<\/span>\n            <p class=\"text-callout\" style=\"margin: 0;\"><span class=\"text-subheadline-emphasized\">Supports: <\/span>kidney failure 2–4 days after ingestion; peace lily and calla lily listed as 'imposter' lilies.<\/p>\n            <p class=\"text-callout\" style=\"margin: 0;\"><span class=\"text-subheadline-emphasized\">Refers to: <\/span>lilies · cats<\/p>\n            <p class=\"text-callout\" style=\"margin: 0;\"><span class=\"text-subheadline-emphasized\">Independence: <\/span>MSD Veterinary Manual and Pet Poison Helpline count as one source here, because a Pet Poison Helpline toxicologist wrote the MSD chapter.<\/p>\n          <\/article>\n\n          <article style=\"display: flex; flex-direction: column; gap: var(--space-8); padding: var(--padding-md); border-radius: var(--radius-sm); border: var(--border-width-default) solid var(--border-default);\">\n            <span class=\"text-headline\">International Cat Care<\/span>\n            <p class=\"text-callout\" style=\"margin: 0;\"><span class=\"text-subheadline-emphasized\">Supports: <\/span>vase water, for lilies; 'pollen-free' lilies are still unsafe.<\/p>\n            <p class=\"text-callout\" style=\"margin: 0;\"><span class=\"text-subheadline-emphasized\">Refers to: <\/span>lilies · cats<\/p>\n            <p class=\"text-callout\" style=\"margin: 0;\"><span class=\"text-subheadline-emphasized\">Independence: <\/span>not verified.<\/p>\n          <\/article>\n        <\/div>\n\n        <div style=\"display: flex; flex-direction: column; gap: var(--space-8); align-items: flex-start;\">\n          <span class=\"text-subheadline-emphasized\" style=\"color: var(--text-secondary);\">Where sources agree<\/span>\n          <x-import component-from-global-scope=\"Snoof.EvidenceStatus\" state=\"Sources agree, independence not verified\" label=\"Sources agree on this\"><\/x-import>\n          <ul class=\"text-callout\" style=\"margin: 0; padding-left: var(--space-20); display: flex; flex-direction: column; gap: var(--space-4);\">\n            <li>Classification — ASPCA, Pet Poison Helpline, Cats Protection<\/li>\n            <li>Kidney failure — ASPCA, MSD Veterinary Manual<\/li>\n            <li>Vase water, for lilies — Pet Poison Helpline, International Cat Care<\/li>\n          <\/ul>\n        <\/div>\n\n        <div style=\"display: flex; flex-direction: column; gap: var(--space-8);\">\n          <span class=\"text-subheadline-emphasized\" style=\"color: var(--text-secondary);\">Where sources differ<\/span>\n          <p class=\"text-callout\" style=\"margin: 0;\">Sources differ slightly on which lilies they include.<\/p>\n        <\/div>\n\n        <div style=\"display: flex; flex-direction: column; gap: var(--space-8); align-items: flex-start;\">\n          <span class=\"text-subheadline-emphasized\" style=\"color: var(--text-secondary);\">Gaps<\/span>\n          <x-import component-from-global-scope=\"Snoof.EvidenceStatus\" state=\"Single source\" label=\"Single source\"><\/x-import>\n          <p class=\"text-callout\" style=\"margin: 0;\">Pollen through rubbing and licking — Cats Protection only.<\/p>\n          <p class=\"text-callout\" style=\"margin: 0;\">Plant lists from these sources aren't complete.<\/p>\n        <\/div>\n\n        <div style=\"display: flex; flex-direction: column; gap: var(--space-8);\">\n          <span class=\"text-subheadline-emphasized\" style=\"color: var(--text-secondary);\">Remaining limitations<\/span>\n          <p class=\"text-callout\" style=\"margin: 0;\">We couldn't verify whether these sources are independent of each other.<\/p>\n          <p class=\"text-callout\" style=\"margin: 0;\">Nothing here predicts what will happen to Jäger, and habits can change.<\/p>\n        <\/div>\n              <\/sc-if>\n        <sc-if value=\"{{shield}}\" hint-placeholder-val=\"{{ false }}\">\n        <div style=\"display: flex; flex-direction: column; gap: var(--space-4);\">\n          <span><span class=\"text-headline\">Red shield plant<\/span> <span class=\"text-body\" style=\"color: var(--text-secondary);\">·<\/span> <span class=\"text-body\" style=\"font-style: italic;\">Homalomena rubescens<\/span><\/span>\n          <span class=\"text-subheadline\" style=\"color: var(--text-secondary);\">Checked for cats<\/span>\n        <\/div>\n\n        <div style=\"display: flex; flex-direction: column; gap: var(--space-12);\">\n          <span class=\"text-subheadline-emphasized\" style=\"color: var(--text-secondary);\">Each source<\/span>\n          <article style=\"display: flex; flex-direction: column; gap: var(--space-8); padding: var(--padding-md); border-radius: var(--radius-sm); border: var(--border-width-default) solid var(--border-default);\">\n            <span class=\"text-headline\">Cats Protection<\/span>\n            <p class=\"text-callout\" style=\"margin: 0;\"><span class=\"text-subheadline-emphasized\">Supports: <\/span>“caution advised” listing.<\/p>\n            <p class=\"text-callout\" style=\"margin: 0;\"><span class=\"text-subheadline-emphasized\">Refers to: <\/span>Homalomena rubescens · cats<\/p>\n            <p class=\"text-callout\" style=\"margin: 0;\"><span class=\"text-subheadline-emphasized\">Independence: <\/span>single source for this listing.<\/p>\n          <\/article>\n        <\/div>\n\n        <div style=\"display: flex; flex-direction: column; gap: var(--space-8); align-items: flex-start;\">\n          <span class=\"text-subheadline-emphasized\" style=\"color: var(--text-secondary);\">Gaps<\/span>\n          <x-import component-from-global-scope=\"Snoof.EvidenceStatus\" state=\"Limited information\" label=\"Not enough information\"><\/x-import>\n          <p class=\"text-callout\" style=\"margin: 0;\">The “caution advised” category isn't defined by the source.<\/p>\n          <p class=\"text-callout\" style=\"margin: 0;\">No cat-specific classification, effects, severity, plant parts or exposure routes are documented in the sources checked.<\/p>\n        <\/div>\n\n        <div style=\"display: flex; flex-direction: column; gap: var(--space-8);\">\n          <span class=\"text-subheadline-emphasized\" style=\"color: var(--text-secondary);\">Not toxicity evidence<\/span>\n          <p class=\"text-callout\" style=\"margin: 0;\">NParks Flora &amp; Fauna Web and NC State Extension are used for botanical and horticultural information only. NC State's genus-level toxicity information is pending separate evidence review.<\/p>\n          <span class=\"text-caption-1\" style=\"color: var(--text-secondary);\">Based on the sources listed. Not yet reviewed by an expert.<\/span>\n        <\/div>\n        <\/sc-if>\n      <\/div>\n    <\/div>\n  <\/section>\n<\/div>\n<\/x-dc>\n<script type=\"text/x-dc\" data-dc-script data-props='{\"capture\":{\"editor\":\"boolean\",\"default\":false},\"$preview\":{\"width\":393,\"height\":852}}'>\nclass Component extends DCLogic {\n  renderVals() {\n    const capture = this.props.capture === true || this.props.capture === 'true';\n    const A = this.props.act || null;\n    const shield = !!A && this.props.plant === 'shield';\n    return {\n      lily: !shield, shield: shield,\n      onClose: (e) => { if (!A || !A.close) return; if (e && e.preventDefault) e.preventDefault(); A.close(); },\n      rootHeight: capture ? 'auto' : '852px',\n      sheetPosition: capture ? 'relative' : 'absolute',\n      sheetTop: capture ? '0px' : 'calc(var(--space-48) + var(--space-12))',\n      sheetMarginTop: capture ? 'calc(var(--space-48) + var(--space-12))' : '0px',\n      scrollFlex: capture ? 'none' : '1 1 0%',\n      scrollOverflow: capture ? 'visible' : 'auto'\n    };\n  }\n}\n<\/script>\n<\/body>\n<\/html>\n", "./Main.dc.html": "<!doctype html>\n<html lang=\"en\ surface-inverse) 65%, transparent);\">\n          <h1 class=\"display-title-1\" style=\"margin: 0; color: var(--text-on-inverse);\">{{plantName}}<\/h1>\n          <span class=\"text-body\" style=\"font-style: italic; color: var(--text-on-inverse); margin-top: calc(var(--space-2) * -1);\">{{sciName}}<span style=\"font-style: normal;\">{{sciCv}}<\/span><\/span>\n        <\/div>\n        \n      <\/div>\n    <\/div>\n\n    <div style=\"position: relative; margin-top: calc(var(--space-32) * -1); border-radius: var(--radius-xl) var(--radius-xl) 0 0; background: var(--surface-default); padding: var(--space-16) var(--space-16) {{contentPadBottom}}; display: flex; flex-direction: column; gap: var(--space-16);\">\n\n      <sc-if value=\"{{isToxic}}\" hint-placeholder-val=\"{{ true }}\">\n        <x-import component-from-global-scope=\"Snoof.PrimaryFinding\" style=\"display: block;\" classification=\"Documented toxicity\" toxic-label=\"Toxic to cats\" attribution=\"ASPCA, Pet Poison Helpline and Cats Protection classify Easter lily as toxic to cats.\"><\/x-import>\n      <\/sc-if>\n      <sc-if value=\"{{isNonToxic}}\" hint-placeholder-val=\"{{ false }}\">\n        <x-import component-from-global-scope=\"Snoof.PrimaryFinding\" style=\"display: block;\" classification=\"Documented non-toxicity\" non-toxic-label=\"Non-toxic to cats\" attribution=\"Listed as non-toxic by the ASPCA Animal Poison Control.\"><\/x-import>\n      <\/sc-if>\n\n      <div role=\"tablist\" aria-label=\"Plant finding sections\" style=\"display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: var(--space-4); padding: var(--space-4); border-radius: var(--radius-full); background-color: var(--background-primary, #f8f4ee)\">\n        <button type=\"button\" role=\"tab\" aria-selected=\"{{tabSafety}}\" onClick=\"{{on.tabSafety}}\" class=\"{{clsSafety}}\" style=\"min-height: var(--size-touch-target-min); border: 0; border-radius: var(--radius-full); background: {{bgSafety}}; box-shadow: {{shSafety}}; color: var(--text-primary); cursor: pointer;\">Pet safety<\/button>\n        <button type=\"button\" role=\"tab\" aria-selected=\"{{tabInfo}}\" onClick=\"{{on.tabInfo}}\" class=\"{{clsInfo}}\" style=\"min-height: var(--size-touch-target-min); border: 0; border-radius: var(--radius-full); background: {{bgInfo}}; box-shadow: {{shInfo}}; color: var(--text-primary); cursor: pointer;\">Plant info<\/button>\n        <button type=\"button\" role=\"tab\" aria-selected=\"{{tabEvidence}}\" onClick=\"{{on.tabEvidence}}\" class=\"{{clsEvidence}}\" style=\"min-height: var(--size-touch-target-min); border: 0; border-radius: var(--radius-full); background: {{bgEvidence}}; box-shadow: {{shEvidence}}; color: var(--text-primary); cursor: pointer;\">Evidence<\/button>\n      <\/div>\n\n      <sc-if value=\"{{tabSafety}}\" hint-placeholder-val=\"{{ true }}\">\n        <div role=\"tabpanel\" style=\"display: flex; flex-direction: column; gap: var(--space-12);\">\n\n          <div style=\"display: flex; align-items: center; gap: var(--space-12); padding: var(--padding-md); border-radius: var(--radius-lg); background-color: var(--surface-nature, #e4edec)\">\n            <img src=\"{{petAvatar}}\" alt=\"\" style=\"width: 56px; height: 56px; flex: none; border-radius: var(--radius-full); object-fit: cover; background: var(--surface-warm);\">\n            <div style=\"flex: 1; display: flex; flex-direction: column; gap: var(--space-2);\">\n              <span class=\"text-subheadline-emphasized\">{{petLine}}<\/span>\n              <sc-if value=\"{{hasPetSub}}\" hint-placeholder-val=\"{{ true }}\">\n                <span class=\"text-footnote\" style=\"color: var(--text-secondary);\">{{petSub}}<\/span>\n              <\/sc-if>\n            <\/div>\n          <\/div>\n\n          <sc-if value=\"{{showCA}}\" hint-placeholder-val=\"{{ true }}\">\n            <x-import component-from-global-scope=\"Snoof.ContextualAttention\" style=\"display: block;\" heading=\"Relevant to {{petName}}\" body=\"You told us {{petName}} chews plants and drinks from vases. The sources describe eating the plant and drinking vase water as ways cats can be exposed to lilies.\"><\/x-import>\n          <\/sc-if>\n          <sc-if value=\"{{showCAGap}}\" hint-placeholder-val=\"{{ false }}\">\n            <div style=\"padding: var(--padding-lg); border-radius: var(--radius-md); border: var(--border-width-default) dashed var(--border-strong);\">\n              <span class=\"text-subheadline-emphasized\">Not covered in this prototype.<\/span>\n            <\/div>\n          <\/sc-if>\n\n          <sc-if value=\"{{showSections}}\" hint-placeholder-val=\"{{ true }}\">\n            <div data-effects-card=\"true\"><x-import component-from-global-scope=\"Snoof.ExpandableInformationCard\" style=\"display: block;\" title=\"What it can do\" summary=\"ASPCA lists vomiting, loss of appetite, lethargy and kidney failure in cats, and notes that death is possible. ASPCA also says very small exposures to any part of the plant, including the pollen, can result in kidney injury and death.\" state=\"{{effectsState}}\">\n              <ul class=\"text-callout\" style=\"margin: 0; padding-left: var(--space-20); display: flex; flex-direction: column; gap: var(--space-8);\">\n                <li>Kidney failure can develop within 48–72 hours — ASPCA<\/li>\n                <li>Kidney failure 2–4 days after ingestion — MSD Veterinary Manual<\/li>\n                <li>Cats are the only species known to be affected — ASPCA<\/li>\n              <\/ul>\n            <\/x-import><\/div>\n\n            <section style=\"display: flex; flex-direction: column; gap: var(--space-12); padding: var(--padding-lg); border-radius: var(--radius-lg); background: var(--background-primary);\">\n              <div style=\"display: flex; align-items: center; gap: var(--space-8);\">\n                <x-import component-from-global-scope=\"Snoof.Icon\" name=\"Leaf\" size=\"{{n24}}\" color=\"var(--text-accent)\"><\/x-import>\n                <h2 class=\"display-title-3\" style=\"margin: 0;\">Which parts, and how exposure happens<\/h2>\n              <\/div>\n              <p class=\"text-body\" style=\"margin: 0;\">All parts: leaves, stem, flowers, pollen and the rhizome (root) — Pet Poison Helpline.<\/p>\n              <ul class=\"text-callout\" style=\"margin: 0; padding-left: var(--space-20); display: flex; flex-direction: column; gap: var(--space-8);\">\n                <li>Eating any part<\/li>\n                <li>Pollen picked up on the fur: Cats Protection describes cats rubbing against the flower and then licking their fur<\/li>\n                <li>Drinking water from a vase holding lilies — Pet Poison Helpline<\/li>\n              <\/ul>\n            <\/section>\n\n            <section style=\"display: flex; flex-direction: column; gap: var(--space-12); padding: var(--padding-lg); border-radius: var(--radius-lg); background: var(--background-primary);\">\n              <div style=\"display: flex; align-items: center; gap: var(--space-8);\">\n                <x-import component-from-global-scope=\"Snoof.Icon\" name=\"Paw\" size=\"{{n24}}\" color=\"var(--text-accent)\"><\/x-import>\n                <h2 class=\"display-title-3\" style=\"margin: 0;\">{{interactionsTitle}}<\/h2>\n              <\/div>\n              <sc-if value=\"{{showRows}}\" hint-placeholder-val=\"{{ true }}\">\n                <p class=\"text-callout\" style=\"margin: 0; color: var(--text-secondary);\">This shows how exposure can happen according to the sources, not whether it will happen for {{petName}}.<\/p>\n                <sc-if value=\"{{rB1}}\" hint-placeholder-val=\"{{ true }}\"><div style=\"display: flex; flex-direction: column; gap: var(--space-8); padding-top: var(--space-12); border-top: var(--border-width-default) solid var(--border-subtle);\">\n                  <span class=\"text-headline\">Chews plants<\/span>\n                  <x-import component-from-global-scope=\"Snoof.BehaviourMarker\" marker=\"Documented connection\"><\/x-import>\n                  <p class=\"text-callout\" style=\"margin: 0;\">You mentioned that {{petName}} chews plants. According to Pet Poison Helpline, eating any part of a lily from the Lilium genus is a documented exposure route for cats.<\/p>\n                <\/div><\/sc-if>\n                <sc-if value=\"{{rB5}}\" hint-placeholder-val=\"{{ true }}\"><div style=\"display: flex; flex-direction: column; gap: var(--space-8); padding-top: var(--space-12); border-top: var(--border-width-default) solid var(--border-subtle);\">\n                  <span class=\"text-headline\">Drinks from vases<\/span>\n                  <x-import component-from-global-scope=\"Snoof.BehaviourMarker\" marker=\"Documented connection\"><\/x-import>\n                  <p class=\"text-callout\" style=\"margin: 0;\">You mentioned that {{petName}} drinks water from vases. According to Pet Poison Helpline, water from a vase holding lilies is a documented exposure route for cats.<\/p>\n                <\/div><\/sc-if>\n                <sc-if value=\"{{rB4}}\" hint-placeholder-val=\"{{ true }}\"><div style=\"display: flex; flex-direction: column; gap: var(--space-8); padding-top: var(--space-12); border-top: var(--border-width-default) solid var(--border-subtle);\">\n                  <span class=\"text-headline\">Lies or sleeps on plants or pots<\/span>\n                  <x-import component-from-global-scope=\"Snoof.BehaviourMarker\" marker=\"Not enough evidence to connect this behaviour\"><\/x-import>\n                  <p class=\"text-callout\" style=\"margin: 0;\">You mentioned that {{petName}} lies or sleeps on plants or pots. We couldn't find enough information to say whether this is an exposure route for Easter lily. Cats Protection describes cats picking up lily pollen by rubbing against the flower and licking their fur.<\/p>\n                <\/div><\/sc-if>\n                <sc-if value=\"{{rB2}}\" hint-placeholder-val=\"{{ true }}\"><div style=\"display: flex; flex-direction: column; gap: var(--space-8); padding-top: var(--space-12); border-top: var(--border-width-default) solid var(--border-subtle);\">\n                  <span class=\"text-headline\">Sniffs plants<\/span>\n                  <x-import component-from-global-scope=\"Snoof.BehaviourMarker\" marker=\"No documented connection found\"><\/x-import>\n                  <p class=\"text-callout\" style=\"margin: 0;\">You mentioned that {{petName}} sniffs plants. The sources we consulted describe how cats can be exposed to lilies, but not through sniffing. That doesn't mean exposure this way is impossible.<\/p>\n                <\/div><\/sc-if>\n              <\/sc-if>\n              <sc-if value=\"{{isB2}}\" hint-placeholder-val=\"{{ false }}\">\n                <p class=\"text-body\" style=\"margin: 0;\">You weren't sure how {{petName}} interacts with plants, so this result isn't based on {{petName}}'s habits. The exposure routes above are documented for cats regardless.<\/p>\n              <\/sc-if>\n              <sc-if value=\"{{isLilyTemp}}\" hint-placeholder-val=\"{{ false }}\">\n                <p class=\"text-body\" style=\"margin: 0;\">The behaviours you added are shown as context for this check only. The exposure routes above are documented for cats regardless.<\/p>\n              <\/sc-if>\n              <sc-if value=\"{{isB4}}\" hint-placeholder-val=\"{{ false }}\">\n                <p class=\"text-body\" style=\"margin: 0;\">No behaviours were added for this check. The exposure routes above are documented for cats regardless.<\/p>\n              <\/sc-if>\n            <\/section>\n\n            <x-import component-from-global-scope=\"Snoof.ExpandableInformationCard\" style=\"display: block;\" title=\"What isn't known\" summary=\"{{limitsSummary}}\" state=\"Collapsed\">\n              <ul class=\"text-callout\" style=\"margin: 0; padding-left: var(--space-20); display: flex; flex-direction: column; gap: var(--space-8);\">\n                <li>Not every plant called 'lily' is a true lily. MSD Veterinary Manual lists plants such as peace lily and calla lily as 'imposter' lilies, so the exact plant matters.<\/li>\n                <li>'Pollen-free' lilies can be marked as safe for cats. International Cat Care says they are still unsafe.<\/li>\n                <li>Sources differ slightly on which lilies they include.<\/li>\n                <li>Plant lists from these sources aren't complete.<\/li>\n              <\/ul>\n            <\/x-import>\n\n            <div style=\"display: flex; flex-direction: column; gap: var(--space-8); align-items: flex-start; padding: var(--space-12) var(--space-4) 0; border-top: var(--border-width-default) solid var(--border-subtle);\">\n              <span class=\"text-footnote\" style=\"color: var(--text-secondary);\">Evidence status<\/span>\n              <x-import component-from-global-scope=\"Snoof.EvidenceStatus\" state=\"Sources agree, independence not verified\" label=\"Sources agree on the classification\"><\/x-import>\n              <p class=\"text-footnote\" style=\"margin: 0; color: var(--text-secondary);\">We couldn't verify whether these sources are independent of each other.<\/p>\n            <\/div>\n          <\/sc-if>\n\n          <sc-if value=\"{{isI5}}\" hint-placeholder-val=\"{{ false }}\">\n            <section style=\"display: flex; flex-direction: column; gap: var(--space-12); padding: var(--padding-lg); border-radius: var(--radius-lg); background: var(--background-primary);\">\n              <h2 class=\"display-title-3\" style=\"margin: 0;\">What it can do<\/h2>\n              <p class=\"text-body\" style=\"margin: 0;\">No specific toxic effects are described in the cited ASPCA entry.<\/p>\n            <\/section>\n\n            <section style=\"display: flex; flex-direction: column; gap: var(--space-12); padding: var(--padding-lg); border-radius: var(--radius-lg); background: var(--background-primary);\">\n              <div style=\"display: flex; align-items: center; gap: var(--space-8);\">\n                <x-import component-from-global-scope=\"Snoof.Icon\" name=\"Leaf\" size=\"{{n24}}\" color=\"var(--text-accent)\"><\/x-import>\n                <h2 class=\"display-title-3\" style=\"margin: 0;\">Which parts, and how exposure happens<\/h2>\n              <\/div>\n              <p class=\"text-body\" style=\"margin: 0;\">No plant-specific route details are provided by that source.<\/p>\n            <\/section>\n\n            <section style=\"display: flex; flex-direction: column; gap: var(--space-12); padding: var(--padding-lg); border-radius: var(--radius-lg); background: var(--background-primary);\">\n              <div style=\"display: flex; align-items: center; gap: var(--space-8);\">\n                <x-import component-from-global-scope=\"Snoof.Icon\" name=\"Paw\" size=\"{{n24}}\" color=\"var(--text-accent)\"><\/x-import>\n                <h2 class=\"display-title-3\" style=\"margin: 0;\">{{interactionsTitle}}<\/h2>\n              <\/div>\n              <p class=\"text-body\" style=\"margin: 0;\">{{fernPetText}}<\/p>\n            <\/section>\n\n            <x-import component-from-global-scope=\"Snoof.ExpandableInformationCard\" style=\"display: block;\" title=\"What isn't known\" summary=\"The classification is not a guarantee that every exposure is harmless.\" state=\"Collapsed\">\n              <ul class=\"text-callout\" style=\"margin: 0; padding-left: var(--space-20); display: flex; flex-direction: column; gap: var(--space-8);\">\n                <li>Only one relevant toxicity source (ASPCA) lists this plant; it has not been cross-checked with another toxicity source.<\/li>\n              <\/ul>\n            <\/x-import>\n\n            <div style=\"display: flex; flex-direction: column; gap: var(--space-8); align-items: flex-start; padding: var(--space-12) var(--space-4) 0; border-top: var(--border-width-default) solid var(--border-subtle);\">\n              <span class=\"text-footnote\" style=\"color: var(--text-secondary);\">Evidence status<\/span>\n              <x-import component-from-global-scope=\"Snoof.EvidenceStatus\" state=\"Single source\" label=\"Single relevant toxicity source\"><\/x-import>\n              <p class=\"text-footnote\" style=\"margin: 0; color: var(--text-secondary);\">Not cross-checked with another toxicity source.<\/p>\n              <span class=\"text-caption-1\" style=\"color: var(--text-secondary);\">Based on the sources listed. Not yet reviewed by an expert.<\/span>\n            <\/div>\n          <\/sc-if>\n        <\/div>\n      <\/sc-if>\n\n      <sc-if value=\"{{infoLily}}\" hint-placeholder-val=\"{{ false }}\">\n        <div role=\"tabpanel\" style=\"display: flex; flex-direction: column; gap: var(--space-12);\">\n          <section style=\"display: flex; flex-direction: column; gap: var(--space-12); padding: var(--padding-lg); border-radius: var(--radius-lg); background: var(--background-primary);\">\n            <div style=\"display: flex; align-items: center; gap: var(--space-8);\">\n              <x-import component-from-global-scope=\"Snoof.Icon\" name=\"Leaf\" size=\"{{n24}}\" color=\"var(--text-accent)\"><\/x-import>\n              <h2 class=\"display-title-3\" style=\"margin: 0;\">About Easter lily<\/h2>\n            <\/div>\n            <p class=\"text-body\" style=\"margin: 0;\">Easter lily (<i>Lilium longiflorum<\/i>) is a bulbous perennial known for its large, white, trumpet-shaped flowers. It is commonly grown as an ornamental plant, especially around Easter.<\/p>\n            <div style=\"display: flex; flex-direction: column; gap: var(--space-2); padding-top: var(--space-12); border-top: var(--border-width-default) solid var(--border-subtle);\">\n              <span class=\"text-subheadline-emphasized\">Scientific name<\/span>\n              <span class=\"text-body\" style=\"font-style: italic; color: var(--text-secondary);\">Lilium longiflorum<\/span>\n            <\/div>\n            <div style=\"display: flex; flex-direction: column; gap: var(--space-2);\">\n              <span class=\"text-subheadline-emphasized\">Common name<\/span>\n              <span class=\"text-body\" style=\"color: var(--text-secondary);\">Easter lily<\/span>\n            <\/div>\n          <\/section>\n\n          <section style=\"display: flex; flex-direction: column; gap: var(--space-12); padding: var(--padding-lg); border-radius: var(--radius-lg); background: var(--background-primary);\">\n            <div style=\"display: flex; flex-direction: column; gap: var(--space-2);\">\n              <h2 class=\"display-title-3\" style=\"margin: 0;\">Plant care<\/h2>\n              <p class=\"text-subheadline\" style=\"margin: 0; color: var(--text-secondary);\">For growing the plant. Not about pet safety.<\/p>\n            <\/div>\n            <div style=\"display: flex; flex-direction: column; gap: var(--space-2); padding: var(--padding-md); border-radius: var(--radius-md); background: var(--surface-default);\">\n              <span style=\"display: flex; align-items: center; gap: var(--space-8);\"><span class=\"ph-glyph ph-sun\" aria-hidden=\"true\" style=\"width: 20px; height: 20px;\"><\/span><span class=\"text-headline\">Light<\/span><\/span>\n              <span class=\"text-subheadline\" style=\"color: var(--text-secondary);\">Bright light, protected from intense direct sun.<\/span>\n            <\/div>\n            <div style=\"display: flex; flex-direction: column; gap: var(--space-2); padding: var(--padding-md); border-radius: var(--radius-md); background: var(--surface-default);\">\n              <span style=\"display: flex; align-items: center; gap: var(--space-8);\"><span class=\"ph-glyph ph-drop\" aria-hidden=\"true\" style=\"width: 20px; height: 20px;\"><\/span><span class=\"text-headline\">Water<\/span><\/span>\n              <span class=\"text-subheadline\" style=\"color: var(--text-secondary);\">Keep the growing medium moderately moist, avoiding waterlogging.<\/span>\n            <\/div>\n            <div style=\"display: flex; flex-direction: column; gap: var(--space-2); padding: var(--padding-md); border-radius: var(--radius-md); background: var(--surface-default);\">\n              <span style=\"display: flex; align-items: center; gap: var(--space-8);\"><span class=\"ph-glyph ph-tulip\" aria-hidden=\"true\" style=\"width: 20px; height: 20px;\"><\/span><span class=\"text-headline\">Soil<\/span><\/span>\n              <span class=\"text-subheadline\" style=\"color: var(--text-secondary);\">Fertile, organic-rich, well-drained soil.<\/span>\n            <\/div>\n            <div style=\"display: flex; flex-direction: column; gap: var(--space-2);\">\n              <span class=\"text-footnote\" style=\"color: var(--text-secondary);\">Cultivation reference: <a href=\"https://www.rhs.org.uk/plants/75002/lilium-longiflorum-ixb-a/details\" target=\"_blank\" rel=\"noopener\" style=\"color: var(--text-accent);\">Royal Horticultural Society (RHS)<\/a><\/span>\n              <span class=\"text-caption-1\" style=\"color: var(--text-secondary);\">Candidate content. Sources not yet verified.<\/span>\n            <\/div>\n          <\/section>\n        <\/div>\n      <\/sc-if>\n\n\n      <sc-if value=\"{{infoFern}}\" hint-placeholder-val=\"{{ false }}\">\n        <div role=\"tabpanel\" style=\"display: flex; flex-direction: column; gap: var(--space-12);\">\n          <section style=\"display: flex; flex-direction: column; gap: var(--space-12); padding: var(--padding-lg); border-radius: var(--radius-lg); background: var(--background-primary);\">\n            <div style=\"display: flex; align-items: center; gap: var(--space-8);\">\n              <x-import component-from-global-scope=\"Snoof.Icon\" name=\"Leaf\" size=\"{{n24}}\" color=\"var(--text-accent)\"><\/x-import>\n              <h2 class=\"display-title-3\" style=\"margin: 0;\">About Boston fern<\/h2>\n            <\/div>\n            <div style=\"display: flex; flex-direction: column; gap: var(--space-2); padding-top: var(--space-12); border-top: var(--border-width-default) solid var(--border-subtle);\">\n              <span class=\"text-subheadline-emphasized\">Scientific name<\/span>\n              <span class=\"text-body\" style=\"color: var(--text-secondary);\"><i>Nephrolepis exaltata<\/i> 'Bostoniensis'<\/span>\n            <\/div>\n            <div style=\"display: flex; flex-direction: column; gap: var(--space-2);\">\n              <span class=\"text-subheadline-emphasized\">Common name<\/span>\n              <span class=\"text-body\" style=\"color: var(--text-secondary);\">Boston fern<\/span>\n            <\/div>\n            <span class=\"text-footnote\" style=\"color: var(--text-secondary);\">Botanical identity: <a href=\"https://plants.ces.ncsu.edu/plants/nephrolepis-exaltata/\" target=\"_blank\" rel=\"noopener\" style=\"color: var(--text-accent);\">NC State Extension<\/a><\/span>\n          <\/section>\n\n          <section style=\"display: flex; flex-direction: column; gap: var(--space-12); padding: var(--padding-lg); border-radius: var(--radius-lg); background: var(--background-primary);\">\n            <div style=\"display: flex; flex-direction: column; gap: var(--space-2);\">\n              <h2 class=\"display-title-3\" style=\"margin: 0;\">Plant care<\/h2>\n              <p class=\"text-subheadline\" style=\"margin: 0; color: var(--text-secondary);\">For growing the plant. Not about pet safety.<\/p>\n            <\/div>\n            <div style=\"display: flex; flex-direction: column; gap: var(--space-2); padding: var(--padding-md); border-radius: var(--radius-md); background: var(--surface-default);\">\n              <span style=\"display: flex; align-items: center; gap: var(--space-8);\"><span class=\"ph-glyph ph-sun\" aria-hidden=\"true\" style=\"width: 20px; height: 20px;\"><\/span><span class=\"text-headline\">Light<\/span><\/span>\n              <span class=\"text-subheadline\" style=\"color: var(--text-secondary);\">Bright, indirect light<\/span>\n            <\/div>\n            <div style=\"display: flex; flex-direction: column; gap: var(--space-2); padding: var(--padding-md); border-radius: var(--radius-md); background: var(--surface-default);\">\n              <span style=\"display: flex; align-items: center; gap: var(--space-8);\"><span class=\"ph-glyph ph-drop\" aria-hidden=\"true\" style=\"width: 20px; height: 20px;\"><\/span><span class=\"text-headline\">Water<\/span><\/span>\n              <span class=\"text-subheadline\" style=\"color: var(--text-secondary);\">Keep soil evenly moist; avoid waterlogging<\/span>\n            <\/div>\n            <div style=\"display: flex; flex-direction: column; gap: var(--space-2); padding: var(--padding-md); border-radius: var(--radius-md); background: var(--surface-default);\">\n              <span style=\"display: flex; align-items: center; gap: var(--space-8);\"><span class=\"ph-glyph ph-thermo\" aria-hidden=\"true\" style=\"width: 20px; height: 20px;\"><\/span><span class=\"text-headline\">Temperature<\/span><\/span>\n              <span class=\"text-subheadline\" style=\"color: var(--text-secondary);\">Prefer moderate indoor temperatures (approximately 16–21°C)<\/span>\n            <\/div>\n            <div style=\"display: flex; flex-direction: column; gap: var(--space-2); padding: var(--padding-md); border-radius: var(--radius-md); background: var(--surface-default);\">\n              <span style=\"display: flex; align-items: center; gap: var(--space-8);\"><span class=\"ph-glyph ph-cloud\" aria-hidden=\"true\" style=\"width: 20px; height: 20px;\"><\/span><span class=\"text-headline\">Humidity<\/span><\/span>\n              <span class=\"text-subheadline\" style=\"color: var(--text-secondary);\">Moderate to high<\/span>\n            <\/div>\n            <div style=\"display: flex; flex-direction: column; gap: var(--space-2); padding: var(--padding-md); border-radius: var(--radius-md); background: var(--surface-default);\">\n              <span style=\"display: flex; align-items: center; gap: var(--space-8);\"><span class=\"ph-glyph ph-tulip\" aria-hidden=\"true\" style=\"width: 20px; height: 20px;\"><\/span><span class=\"text-headline\">Soil<\/span><\/span>\n              <span class=\"text-subheadline\" style=\"color: var(--text-secondary);\">Moisture-retentive, well-draining mix<\/span>\n            <\/div>\n            <div style=\"display: flex; flex-direction: column; gap: var(--space-2); padding: var(--padding-md); border-radius: var(--radius-md); background: var(--surface-default);\">\n              <span style=\"display: flex; align-items: center; gap: var(--space-8);\"><span class=\"ph-glyph ph-carrot\" aria-hidden=\"true\" style=\"width: 20px; height: 20px;\"><\/span><span class=\"text-headline\">Feeding<\/span><\/span>\n              <span class=\"text-subheadline\" style=\"color: var(--text-secondary);\">Diluted balanced fertiliser during active growth<\/span>\n            <\/div>\n            <div style=\"display: flex; flex-direction: column; gap: var(--space-2); padding: var(--padding-md); border-radius: var(--radius-md); background: var(--surface-default);\">\n              <span style=\"display: flex; align-items: center; gap: var(--space-8);\"><span class=\"ph-glyph ph-broom\" aria-hidden=\"true\" style=\"width: 20px; height: 20px;\"><\/span><span class=\"text-headline\">Maintenance<\/span><\/span>\n              <span class=\"text-subheadline\" style=\"color: var(--text-secondary);\">Remove dead fronds; avoid drying drafts<\/span>\n            <\/div>\n            <div style=\"display: flex; flex-direction: column; gap: var(--space-2);\">\n              <span class=\"text-footnote\" style=\"color: var(--text-secondary);\">Cultivation references: <a href=\"https://www.rhs.org.uk/plants/58296/nephrolepis-exaltata-bostoniensis/details\" target=\"_blank\" rel=\"noopener\" style=\"color: var(--text-accent);\">Royal Horticultural Society (RHS)<\/a> · <a href=\"https://libanswers.nybg.org/faq/222598\" target=\"_blank\" rel=\"noopener\" style=\"color: var(--text-accent);\">New York Botanical Garden (NYBG)<\/a><\/span>\n              <span class=\"text-caption-1\" style=\"color: var(--text-secondary);\">Based on the sources listed. Not yet reviewed by an expert.<\/span>\n            <\/div>\n          <\/section>\n        <\/div>\n      <\/sc-if>\n\n      <sc-if value=\"{{evFern}}\" hint-placeholder-val=\"{{ false }}\">\n        <div role=\"tabpanel\" style=\"display: flex; flex-direction: column; gap: var(--space-12);\">\n          <section style=\"display: flex; flex-direction: column; gap: var(--space-12); padding: var(--padding-lg); border-radius: var(--radius-lg); background: var(--background-primary);\">\n            <div style=\"display: flex; flex-direction: column; gap: var(--space-2);\">\n              <h2 class=\"display-title-3\" style=\"margin: 0;\">Sources &amp; evidence<\/h2>\n              <p class=\"text-subheadline\" style=\"margin: 0; color: var(--text-secondary);\">Each source, what it supports and what it refers to.<\/p>\n            <\/div>\n            <div style=\"display: flex; flex-direction: column; gap: var(--space-4); padding-top: var(--space-12); border-top: var(--border-width-default) solid var(--border-subtle);\">\n              <span class=\"text-headline\">ASPCA<\/span>\n              <span class=\"text-subheadline\">Supports: toxicity classification (non-toxic to cats).<\/span>\n              <span class=\"text-footnote\" style=\"color: var(--text-secondary);\">Refers to: Boston fern · cats · Single relevant toxicity source.<\/span>\n            <\/div>\n            <div style=\"display: flex; flex-direction: column; gap: var(--space-4); padding-top: var(--space-12); border-top: var(--border-width-default) solid var(--border-subtle);\">\n              <span class=\"text-headline\">NC State Extension<\/span>\n              <span class=\"text-subheadline\">Supports: botanical identity.<\/span>\n              <span class=\"text-footnote\" style=\"color: var(--text-secondary);\">Not a toxicity source.<\/span>\n            <\/div>\n            <div style=\"display: flex; flex-direction: column; gap: var(--space-4); padding-top: var(--space-12); border-top: var(--border-width-default) solid var(--border-subtle);\">\n              <span class=\"text-headline\">Royal Horticultural Society (RHS)<\/span>\n              <span class=\"text-subheadline\">Supports: horticultural guidance.<\/span>\n              <span class=\"text-footnote\" style=\"color: var(--text-secondary);\">Not a toxicity source.<\/span>\n            <\/div>\n            <div style=\"display: flex; flex-direction: column; gap: var(--space-4); padding-top: var(--space-12); border-top: var(--border-width-default) solid var(--border-subtle);\">\n              <span class=\"text-headline\">New York Botanical Garden (NYBG)<\/span>\n              <span class=\"text-subheadline\">Supports: horticultural guidance.<\/span>\n              <span class=\"text-footnote\" style=\"color: var(--text-secondary);\">Not a toxicity source.<\/span>\n            <\/div>\n          <\/section>\n\n          <section style=\"display: flex; flex-direction: column; gap: var(--space-12); padding: var(--padding-lg); border-radius: var(--radius-lg); background: var(--background-primary);\">\n            <h2 class=\"display-title-3\" style=\"margin: 0;\">Toxicity classification<\/h2>\n            <div style=\"display: flex; flex-direction: column; gap: var(--space-4); align-items: flex-start;\">\n              <span class=\"text-subheadline-emphasized\">Non-toxic to cats<\/span>\n              <x-import component-from-global-scope=\"Snoof.EvidenceStatus\" state=\"Single source\" label=\"Single relevant toxicity source\"><\/x-import>\n              <span class=\"text-footnote\" style=\"color: var(--text-secondary);\">ASPCA · not cross-checked<\/span>\n            <\/div>\n          <\/section>\n\n          <section style=\"display: flex; flex-direction: column; gap: var(--space-8); padding: var(--padding-lg); border-radius: var(--radius-lg); background: var(--background-primary);\">\n            <h2 class=\"display-title-3\" style=\"margin: 0;\">Independence and limitations<\/h2>\n            <ul class=\"text-callout\" style=\"margin: 0; padding-left: var(--space-20); display: flex; flex-direction: column; gap: var(--space-8);\">\n              <li>Botanical and horticultural sources (NC State Extension, RHS, NYBG) are not counted as independent toxicity confirmation.<\/li>\n              <li>The classification is not a guarantee that every exposure is harmless.<\/li>\n            <\/ul>\n            <span class=\"text-caption-1\" style=\"color: var(--text-secondary);\">Based on the sources listed. Not yet reviewed by an expert.<\/span>\n          <\/section>\n        <\/div>\n      <\/sc-if>\n\n      <sc-if value=\"{{evLily}}\" hint-placeholder-val=\"{{ false }}\">\n        <div role=\"tabpanel\" style=\"display: flex; flex-direction: column; gap: var(--space-12);\">\n          <section style=\"display: flex; flex-direction: column; gap: var(--space-12); padding: var(--padding-lg); border-radius: var(--radius-lg); background: var(--background-primary);\">\n            <div style=\"display: flex; flex-direction: column; gap: var(--space-2);\">\n              <h2 class=\"display-title-3\" style=\"margin: 0;\">Sources &amp; evidence<\/h2>\n              <p class=\"text-subheadline\" style=\"margin: 0; color: var(--text-secondary);\">Each source, what it supports and what it refers to.<\/p>\n            <\/div>\n            <div style=\"display: flex; flex-direction: column; gap: var(--space-4); padding-top: var(--space-12); border-top: var(--border-width-default) solid var(--border-subtle);\">\n              <span class=\"text-headline\">ASPCA<\/span>\n              <span class=\"text-subheadline\">Supports: classification (toxic to cats); effects including kidney failure, and that death is possible; kidney failure within 48–72 hours; very small exposures, including pollen; cats as the only species known to be affected.<\/span>\n              <span class=\"text-footnote\" style=\"color: var(--text-secondary);\">Refers to: Easter lily · cats · Independence: not verified.<\/span>\n            <\/div>\n            <div style=\"display: flex; flex-direction: column; gap: var(--space-4); padding-top: var(--space-12); border-top: var(--border-width-default) solid var(--border-subtle);\">\n              <span class=\"text-headline\">Pet Poison Helpline<\/span>\n              <span class=\"text-subheadline\">Supports: classification; all plant parts; eating any part of a lily from the Lilium genus; water from a vase holding lilies.<\/span>\n              <span class=\"text-footnote\" style=\"color: var(--text-secondary);\">Refers to: lilies (Lilium genus) · cats · Independence: counts as one source together with MSD Veterinary Manual.<\/span>\n            <\/div>\n            <div style=\"display: flex; flex-direction: column; gap: var(--space-4); padding-top: var(--space-12); border-top: var(--border-width-default) solid var(--border-subtle);\">\n              <span class=\"text-headline\">Cats Protection<\/span>\n              <span class=\"text-subheadline\">Supports: classification; pollen picked up by rubbing against the flower and licking the fur; advice not to have lilies in the home or garden.<\/span>\n              <span class=\"text-footnote\" style=\"color: var(--text-secondary);\">Refers to: lilies · cats · Independence: not verified.<\/span>\n            <\/div>\n            <div style=\"display: flex; flex-direction: column; gap: var(--space-4); padding-top: var(--space-12); border-top: var(--border-width-default) solid var(--border-subtle);\">\n              <span class=\"text-headline\">MSD Veterinary Manual<\/span>\n              <span class=\"text-subheadline\">Supports: kidney failure 2–4 days after ingestion; peace lily and calla lily listed as 'imposter' lilies.<\/span>\n              <span class=\"text-footnote\" style=\"color: var(--text-secondary);\">Refers to: lilies · cats · Independence: counts as one source with Pet Poison Helpline, because a Pet Poison Helpline toxicologist wrote the MSD chapter.<\/span>\n            <\/div>\n            <div style=\"display: flex; flex-direction: column; gap: var(--space-4); padding-top: var(--space-12); border-top: var(--border-width-default) solid var(--border-subtle);\">\n              <span class=\"text-headline\">International Cat Care<\/span>\n              <span class=\"text-subheadline\">Supports: vase water, for lilies; 'pollen-free' lilies are still unsafe.<\/span>\n              <span class=\"text-footnote\" style=\"color: var(--text-secondary);\">Refers to: lilies · cats · Independence: not verified.<\/span>\n            <\/div>\n          <\/section>\n\n          <section style=\"display: flex; flex-direction: column; gap: var(--space-12); padding: var(--padding-lg); border-radius: var(--radius-lg); background: var(--background-primary);\">\n            <h2 class=\"display-title-3\" style=\"margin: 0;\">Where sources agree<\/h2>\n            <div style=\"display: flex; flex-direction: column; gap: var(--space-4); align-items: flex-start;\">\n              <span class=\"text-subheadline-emphasized\">Classification<\/span>\n              <x-import component-from-global-scope=\"Snoof.EvidenceStatus\" state=\"Sources agree, independence not verified\" label=\"Sources agree on this\"><\/x-import>\n              <span class=\"text-footnote\" style=\"color: var(--text-secondary);\">ASPCA, Pet Poison Helpline, Cats Protection<\/span>\n            <\/div>\n            <div style=\"display: flex; flex-direction: column; gap: var(--space-4); align-items: flex-start; padding-top: var(--space-12); border-top: var(--border-width-default) solid var(--border-subtle);\">\n              <span class=\"text-subheadline-emphasized\">Kidney failure<\/span>\n              <x-import component-from-global-sc ckground: color-mix(in srgb, var(--surface-inverse) 40%, transparent); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); display: flex; align-items: center; justify-content: center; cursor: pointer; text-decoration: none;\">\n            <span class=\"ph-glyph ph-edit\" aria-hidden=\"true\" style=\"width: 20px; height: 20px; color: var(--text-on-inverse);\"><\/span>\n          <\/a>\n        <\/div>\n        <div style=\"position: absolute; left: 0; right: 0; bottom: 0; display: flex; flex-direction: column; gap: var(--space-4); align-items: flex-start; padding: var(--space-40) var(--space-16) calc(var(--space-32) + var(--space-12)); background: linear-gradient(to bottom, transparent 0%, color-mix(in srgb, var(--surface-inverse) 28%, transparent) 40%, color-mix(in srgb, var(--surface-inverse) 50%, transparent) 100%); color: var(--text-on-inverse);\">\n          <span class=\"text-caption-1\" style=\"display: inline-flex; align-items: center; gap: var(--space-4); padding: var(--space-2) var(--padding-sm); border-radius: var(--radius-full); color: var(--text-primary); background-color: var(--finding-non-toxic-background, #e3fcef)\">\n            <x-import component-from-global-scope=\"Snoof.Icon\" name=\"Check\" size=\"{{n14}}\" color=\"var(--text-accent)\"><\/x-import><span>Identified plant<\/span>\n          <\/span>\n          <div style=\"display: flex; flex-direction: column; gap: 0; margin-top: var(--space-4); text-shadow: 0 0 2px color-mix(in srgb, var(--surface-inverse) 70%, transparent), 0 1px 10px color-mix(in srgb, var(--surface-inverse) 65%, transparent);\">\n            <h1 class=\"display-title-1\" style=\"margin: 0; color: var(--text-on-inverse);\">Red shield plant<\/h1>\n            <span class=\"text-body\" style=\"font-style: italic; color: var(--text-on-inverse); margin-top: calc(var(--space-2) * -1);\">Homalomena rubescens<\/span>\n          <\/div>\n        <\/div>\n      <\/div>\n\n      <div style=\"position: relative; margin-top classification is not a guarantee that every exposure is harmless.<\/li>\n            <\/ul>\n          <\/section>\n          <div style=\"display: flex; flex-direction: column; gap: var(--space-8); align-items: flex-start; padding: var(--space-12) var(--space-4) 0; border-top: var(--border-width-default) solid var(--border-subtle);\">\n            <span class=\"text-footnote\" style=\"color: var(--text-secondary);\">Evidence status on 27/10/2026<\/span>\n            <x-import component-from-global-scope=\"Snoof.EvidenceStatus\" state=\"Single source\" label=\"Single relevant toxicity source\"><\/x-import>\n            <p class=\"text-footnote\" style=\"margin: 0; color: var(--text-secondary);\">Not cross-checked with another toxicity source.<\/p>\n          <\/div>\n        <\/sc-if>\n        <sc-if value=\"{{lilySaved}}\" hint-placeholder-val=\"{{ true }}\">\n          <section style=\"display: flex; flex-direction: column; gap: var(--space-8); padding: var(--padding-lg); border-radius: var(--radius-lg); background: var(--background-primary);\">\n            <h3 class=\"display-title-3\" style=\"margin: 0;\">What wasn't known<\/h3>\n            <ul class=\"text-callout\" style=\"margin: 0; padding-left: var(--space-20); display: flex; flex-direction: column; gap: var(--space-8);\">\n              <li>Nothing here predicts what will happen to {{petName}}, and habits can change.<\/li>\n              <li>Not every plant called 'lily' is a true lily. MSD Veterinary Manual lists plants such as peace lily and calla lily as 'imposter' lilies, so the exact plant matters.<\/li>\n              <li>'Pollen-free' lilies can be marked as safe for cats. International Cat Care says they are still unsafe.<\/li>\n              <li>Sources differ slightly on which lilies they include.<\/li>\n              <li>Plant lists from these sources aren't complete.<\/li>\n            <\/ul>\n          <\/section>\n          <div style=\"display: flex; flex-direction: column; gap: var(--spa flex; flex-direction: column; gap: var(--space-2);\">\n              <span class=\"text-subheadline-emphasized\">Family<\/span>\n              <span class=\"text-body\" style=\"color: var(--text-secondary);\">Araceae<\/span>\n            <\/div>\n            <div style=\"display: flex; flex-direction: column; gap: var(--space-2);\">\n              <span class=\"text-subheadline-emphasized\">Common names<\/span>\n              <span class=\"text-body\" style=\"color: var(--text-secondary);\">Red shield plant, Queen of Hearts<\/span>\n            <\/div>\n          <\/section>\n        <\/div>\n      <\/sc-if>\n      <sc-if value=\"{{infoFern}}\" hint-placeholder-val=\"{{ false }}\">\n        <div role=\"tabpanel\" style=\"display: flex; flex-direction: column; gap: var(--space-12);\">\n          <section style=\"display: flex; flex-direction: column; gap: var(--space-12); padding: var(--padding-lg); border-radius: var(--radius-lg); background: var(--background-primary);\">\n            <div style=\"display: flex; align-items: center; gap: var(--space-8);\">\n              <x-import component-from-global-scope=\"Snoof.Icon\" name=\"Leaf\" size=\"{{n24}}\" color=\"var(--text-accent)\"><\/x-import>\n              <h2 class=\"display-title-3\" style=\"margin: 0;\">About Boston fern<\/h2>\n            <\/div>\n            <div style=\"display: flex; flex-direction: column; gap: var(--space-2); padding-top: var(--space-12); border-top: var(--border-width-default) solid var(--border-subtle);\">\n              <span class=\"text-subheadline-emphasized\">Scientific name<\/span>\n              <span class=\"text-body\" style=\"color: var(--text-secondary);\"><i>Nephrolepis exaltata<\/i> 'Bostoniensis'<\/span>\n            <\/div>\n            <div style=\"display: flex; flex-direction: column; gap: var(--space-2);\">\n              <span class=\"text-subheadline-emphasized\">Common name<\/span>\n              <span class=\"text-body\" style=\"color: var(--text-secondary);\">Boston fern<\/span>\n            <\/div>\n          <\/section>\n        <\/div>\n      <\/sc-if>\n      <sc-if value=\"{{infoLily}}\" hint-placeholder-val=\"{{ false }}\">\n        <div role=\"tabpanel\" style=\"display: flex; flex-direction: column; gap: var(--space-12);\">\n          <section style=\"display: flex; flex-direction: column; gap: var(--space-12); padding: var(--padding-lg); border-radius: var(--radius-lg); background: var(--background-primary);\">\n            <div style=\"display: flex; align-items: center; gap: var(--space-8);\">\n              <x-import component-from-global-scope=\"Snoof.Icon\" name=\"Leaf\" size=\"{{n24}}\" color=\"var(--text-accent)\"><\/x-import>\n              <h2 class=\"display-title-3\" style=\"margin: 0;\">About Easter lily<\/h2>\n            <\/div>\n            <p class=\"text-body\" style=\"margin: 0;\">Easter lily (<i>Lilium longiflorum<\/i>) is a bulbous perennial known for its large, white, trumpet-shaped flowers. It is commonly grown as an ornamental plant, especially around Easter.<\/p>\n            <div style=\"display: flex; flex-direction: column; gap: var(--space-2); padding-top: var(--space-12); border-top: var(--border-width-default) solid var(--border-subtle);\">\n              <span class=\"text-subheadline-emphasized\">Scientific name<\/span>\n              <span class=\"text-body\" style=\"font-style: italic; color: var(--text-secondary);\">Lilium longiflorum<\/span>\n            <\/div>\n            <div style=\"display: flex; flex-direction: column; gap: var(--space-2);\">\n              <span class=\"text-subheadline-emphasized\">Common name<\/span>\n              <span class=\"text-body\" style=\"color: var(--text-secondary);\">Easter lily<\/span>\n            <\/div>\n          <\/section>\n        <\/div>\n      <\/sc-if>\n\n      <sc-if value=\"{{evShield}}\" hint-placeholder-val=\"{{ false }}\">\n        <section style=\"display: flex; flex-direction: column; gap: var(--space-8); padding: var(--padding-lg); border-radius: var(--radius-lg); background: var(--background-primary);\">\n          <h3 class=\"display-title-3\" style=\"margin: 0;\">Sources &amp; evidence<\/h3>\n          <p class=\"text-callout\" style=\"margin: 0;\"><span class=\"text-subheadline-emphasized\">“Caution advised” listing<\/span> — Single source · Cats Protection<\/p>\n          <p class=\"text-callout\" style=\"margin: 0;\">The category isn't defined by the source; no cat-specific effects or exposure routes were documented.<\/p>\n          <p class=\"text-callout\" style=\"margin: 0;\"><span class=\"text-subheadline-emphasized\">Botanical identity and care<\/span> — NParks Flora &amp; Fauna Web, NC State Extension<\/p>\n          <p class=\"text-footnote\" style=\"margin: 0; color: var(--text-secondary);\">Botanical and horticultural sources are not toxicity evidence.<\/p>\n        <\/section>\n      <\/sc-if>\n      <sc-if value=\"{{evFern}}\" hint-placeholder-val=\"{{ false }}\">\n        <section style=\"display: flex; flex-direction: column; gap: var(--space-8); padding: var(--padding-lg); border-radius: var(--radius-lg); background: var(--background-primary);\">\n          <h3 class=\"display-title-3\" style=\"margin: 0;\">Sources &amp; evidence<\/h3>\n          <p class=\"text-callout\" style=\"margin: 0;\"><span class=\"text-subheadline-emphasized\">Toxicity classification<\/span> — Single relevant toxicity source · ASPCA<\/p>\n          <p class=\"text-callout\" style=\"margin: 0;\"><span class=\"text-subheadline-emphasized\">Botanical identity<\/span> — NC State Extension<\/p>\n          <p class=\"text-callout\" style=\"margin: 0;\"><span class=\"text-subheadline-emphasized\">Horticultural guidance<\/span> — RHS, NYBG<\/p>\n          <p class=\"text-footnote\" style=\"margin: 0; color: var(--text-secondary);\">Botanical and horticultural sources are not counted as independent toxicity confirmation.<\/p>\n        <\/section>\n      <\/sc-if>\n      <sc-if value=\"{{evLily}}\         const petCtx = st.tempPet ? 'another' : 'jager';
        go({ confirmV: 'Loading' });
        later(1200, (s) => s.screen === 'confirm' && s.confirmV === 'Loading', () => toS3(petCtx));
      },
      notMine: () => go(openerScreen()),
      petJager: () => {},
      mod02Different: () => go({ screen: 'mod01', mod01Host: 'confirm', mod01V: 'ADisabled' }),
      mod02NoBeh: () => go({ screen: 'mod01', mod01Host: 'confirm', mod01V: 'B' }),

      edit: () => go({ screen: 'mod04' }),
      tabSafety: () => go(this.state.screen === 'saved' ? { savedTab: 'safety' } : { tab: 'safety' }),
      tabInfo: () => go(this.state.screen === 'saved' ? { savedTab: 'info' } : { tab: 'info' }),
      tabEvidence: () => go(this.state.screen === 'saved' ? { savedTab: 'evidence' } : { tab: 'evidence' }),
      guidance: () => go({ screen: 'guidance' }),
      notDeciding: () => exitHome(),

      details: () => go({ screen: 'mod05' }),
      gapPrimary: () => {
        const st = this.state;
        if (st.gapV === 'Default') return go({ gapV: 'Decide' });
        if (st.gapV === 'Decide') { if (st.decision) go({ gapV: 'Closed' }); return; }
        exitHome();
      },
      gapSecondary: () => {
        const st = this.state;
        if (st.gapV === 'Default') return go({ gapV: 'NotDeciding' });
        if (st.gapV === 'Closed' || st.gapV === 'Considering') return go({ screen: 'collection', removed: false, filter: 'all', tempPet: false });
        go({ gapV: 'Considering', ...setRec(recordFrom('Considering', st.saveOn)) });
      },

      pickKeep: pick('keep'), pickAvoid: pick('avoid'), pickOther: pick('other'),
      toggleSave: () => {
        const st = this.state;
        if (st.saveOn) go({ saveOn: false, ...setRec(st.prevRecord) });
        else go({ saveOn: true, ...setRec(recordFrom(st.decision ? DECISION[st.decision] : 'Considering', true)) });
      },
      done: () => {
        const st = this.state;
        if (st.ended) return exitHome();
        if (!st.decision) return;
        go({ ended: 'Closed' });
      },
      secondary: () => {
        const st = this.state;
        if (st.ended) return go({ screen: 'collection', removed: false, filter: 'all', tempPet: false });
        go({ ended: 'Considering', ...setRec(recordFrom('Considering', st.saveOn)) });
      },

      openLily: () => go({ screen: 'saved', savedPlant: 'lily', savedTab: 'safety', confirmRemove: false, reasonDraft: null }),
      openShield: () => go({ screen: 'saved', savedPlant: 'shield', savedTab: 'safety', confirmRemove: false, reasonDraft: null }),
      openFern: () => go({ screen: 'saved', savedPlant: 'fern', savedTab: 'safety', confirmRemove: false, reasonDraft: null }),

      setCheckReason: (t) => { const v = String(t || '').slice(0, 120); const st = this.state; const cr = curRec(); go({ reasonText: v, ...(st.saveOn && cr ? setRec({ ...cr, reason: v.trim() || null }) : {}) }); },
      editReason: () => { const r = this.state.records[this.state.savedPlant]; go({ reasonDraft: r && r.reason ? r.reason : '' }); },
      setReason: (t) => go({ reasonDraft: String(t || '').slice(0, 120) }),
      cancelReason: () => go({ reasonDraft: null }),
      saveReason: () => { const st = this.state; const r = st.records[st.savedPlant]; if (!r) return go({ reasonDraft: null }); const v = (st.reasonDraft || '').trim(); go({ reasonDraft: null, records: { ...st.records, [st.savedPlant]: { ...r, reason: v || null } } }); },
      fAll: () => go({ filter: 'all' }), fToxic: () => go({ filter: 'toxic' }), fNonToxic: () => go({ filter: 'nontoxic' }), fUnclear: () => go({ filter: 'unclear' }),
      checkPlant: () => go({ screen: 'home' }),

      checkAgain: () => {
        const st = this.state;
        const r = st.records[st.savedPlant];
        const opener = r ? r.entry : st.opener;
        if (st.hasPet && !st.tempPet) return go({ opener: opener, ...toS3('jager', st.savedPlant), entry: opener });
        go({ screen: 'confirm', plant: st.savedPlant, opener: opener, correcting: false, confirmV: st.tempPet ? 'A' : 'B' });
      },
      remove: () => go({ confirmRemove: true }),
      cancelRemove: () => go({ confirmRemove: false }),
      confirmRemove: () => go({ confirmRemove: false, records: { ...this.state.records, [this.state.savedPlant]: null }, removed: true, screen: 'collection', filter: 'all' })
    };

    const baseSearch = this.act.search, basePhoto = this.act.photo;
    this.act.search = () => (this.state.screen === 'mod04' ? go({ screen: 'search', searchV: 'Correction', searchQ: this.state.plant === 'fern' ? 'fern' : (this.state.plant === 'shield' ? 'red shield' : 'lily'), correcting: true }) : baseSearch());
    this.act.photo = () => (this.state.screen === 'mod04' ? go({ correcting: true, pickerReturn: resultScreen(), screen: 'picker' }) : basePhoto());
  }

  resetSession() {
    this._session += 1;
    this.setState(this.initialState());
  }
  componentDidMount() {

    const hook = () => {
      const p = window.__dcEditorPicker;
      if (!p || typeof p.setHostPanZoom !== 'function' || p.__snoofPlayHook) return;
      const orig = p.setHostPanZoom;
      let prev = null;
      const self = this;
      p.setHostPanZoom = function (mode) {
        const r = orig.apply(this, arguments);
        const playing = mode === 'play';
        if (playing !== prev) { if (prev !== null || playing) self.resetSession(); prev = playing; }
        return r;
      };
      p.__snoofPlayHook = true;
    };
    hook();
    this._hookTimer = setInterval(hook, 400);
  }
  componentWillUnmount() {
    clearInterval(this._hookTimer);
    this._session += 1;
  }
  renderVals() {
    const st = this.state;
    const s = {}; ['welcome', 'pet', 'creator', 'mod01', 'home', 'picker', 'photo', 'search', 'confirm', 'finding', 'gap', 'mod05', 'mod04', 'guidance', 'collection', 'saved'].forEach((k) => { s[k] = st.screen === k; });
    const r = st.records.lily || null;
    const fr = st.records.fern || null;
    const shr = st.records.shield || null;
    const sr = st.records[st.savedPlant] || null;
    const cr = st.records[st.plant] || null;
    const formAvatar = st.petV === 'Edit' ? (st.editAvatar || st.profileAvatar) : (st.petV === 'SetupDisabled' || st.petV === 'SetupEnabled' ? st.setupAvatar : null);
    return {
      s: s, act: this.act,
      homeV: !st.hasPet ? (st.tempPet ? 'PS2' : 'PS0') : (st.tempPet ? 'PS2' : 'PS1'),
      petV: st.petV, nameOn: st.nameOn, species: st.species, behaviours: st.behaviours, formOther: st.petV === 'Edit' ? st.editOther : st.otherText, formName: st.petV === 'Edit' ? st.editName : st.nameText, profileName: st.profileName, formBeh: st.petV === 'Edit' ? st.editBeh : st.behaviours,
      profileSub: behSummary(st.profileBeh, st.profileOther), profileBeh: st.profileBeh, profileOther: st.profileOther, formAvatar: formAvatar, profileAvatar: st.profileAvatar,
      creatorCtx: st.creatorCtx, mod01V: st.mod01V, mod01Host: st.mod01Host,
      confirmHostV: st.hasPet || st.tempPet ? 'A' : 'B',
      collectionV: (!r && !fr && !shr) ? 'Empty' : 'List',
      searchV: st.searchV, searchQ: st.searchQ, searchShift: st.searchShift, photoV: st.photoV,
      confirmV: st.confirmV, pet: st.pet, confirmPet: st.tempPet ? 'temp' : 'jager',
      plant: st.plant, savedPlant: st.savedPlant,
      findingV: st.plant === 'fern' ? 'I5' : (st.pet === 'nobeh' ? 'B4' : 'Default'), tab: st.tab,
      guidanceV: st.ended || 'Default', decision: st.decision, saveOn: st.saveOn, savedHere: !!cr && st.saveOn,
      hasRecord: !!r, recordDecision: sr ? sr.decision : 'Considering', recordReason: sr ? sr.reason : null,
      hasFern: !!fr, fernDecision: fr ? fr.decision : 'Considering',
      hasShield: !!shr, shieldDecision: shr ? shr.decision : 'Considering',
      recordCount: [r, fr, shr].filter(Boolean).length, reasonDraft: st.reasonDraft,
      savedPlants: { lily: !!r, fern: !!fr, shield: !!shr },
      homeCtx: st.tempPet ? 'ps2' : (st.hasPet ? 'ps1' : 'ps0'),
      gapV: st.gapV, gapSaved: st.gapV === 'Considering' ? !!cr : (!!cr && st.saveOn), mod04Host: st.plant === 'shield' ? 'SCR07' : 'SCR05',
      lilyDecision: r ? r.decision : 'Considering',
      recordEntry: sr ? sr.entry : 'photo', recordPet: sr ? sr.pet : 'jager', recordPetOther: sr ? (sr.petOther || '') : '', recordPetSub: sr && typeof sr.petSub === 'string' ? sr.petSub : null, recordPetName: sr && sr.petName ? sr.petName : st.profileName, reasonText: st.reasonText,
      filter: st.filter, removed: st.removed, savedTab: st.savedTab, confirmRemove: st.confirmRemove
    };
  }
}
</script>
</body>
</html>
