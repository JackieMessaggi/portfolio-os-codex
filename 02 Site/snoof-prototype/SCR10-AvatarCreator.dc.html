        cursor: disabled ? 'default' : 'pointer',
        go: () => { if (!disabled) this.setState({ active: i }); }
      };
    });
    const opts = cat.opts.map(o => {
      const selected = sel[cat.key] === o.id;
      return {
        label: o.label, selected: selected,
        thumb: o.thumb ? B(o.thumb) : '', hasThumb: !!o.thumb, noThumb: !o.thumb,
        ring: selected ? 'inset 0 0 0 var(--border-width-strong) var(--border-focus)' : 'none',
        weight: selected ? 600 : 400,
        pick: () => this.pick(act, o)
      };
    });
    let guide;
    if (f >= CATS.length) guide = 'All set. Save to apply this avatar' + (ctx === 'Setup' ? ' — it stays provisional until you confirm the profile.' : (ctx === 'Edit' ? ' to the form, then save your changes.' : ' to Jäger’s profile.'));
    else if (act < f) guide = 'You can change this. In this demo, a different choice pauses the later categories until the guided choice is back.';
    else {
      const req = cat.opts.find(o => o.id === cat.req);
      guide = act === CATS.length - 1
        ? 'Demo prototype: choose ' + req.label + ' to enable Save avatar.'
        : 'Demo prototype: choose ' + req.label + ' to unlock ' + CATS[act + 1].label + '.';
    }
    const canSave = f >= CATS.length;
    return {
      yes: true, n16: 16, n24: 24,
      isDuo: preview === 'duo', isSingle: preview !== 'duo',
      previewSrc: preview === 'duo' ? '' : B(preview),
      previewAlt: 'Avatar preview',
      hasGap: !!gap,
      gapText: gap ? 'No preview for ' + gap + ' in this prototype. Showing the last available one.' : '',
      cats: cats, opts: opts, activeLabel: cat.label,
      guideText: guide,
      canSave: canSave, cannotSave: !canSave,
      on: on,
      saveHref: lk(back),
      exitHref: lk(back)
    };
  }
}
</script>
