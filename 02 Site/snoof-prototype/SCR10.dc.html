<div data-scr10="true" style="width: 393px; height: 852px; box-sizing: border-box; overflow: hidden; position: relative; background: var(--surface-default); color: var(--text-primary); font-family: var(--font-text);">

        <a href="{{hProfile}}" onClick="{{on.cancelDelete}}" class="text-body" style="display: flex; align-items: center; justify-content: center; min-height: var(--size-touch-target-min); border-right: var(--border-width-default) solid var(--border-default); color: var(--action-tertiary-text); text-decoration: none;">Cancel</a>
